name: Build OneSuite EXE release assets

'on':
  repository_dispatch:
    types:
      - onesuite-release-build
  workflow_dispatch:
    inputs:
      source_repository:
        description: 'Source repository to build'
        required: true
        default: 'Sree-Cognicoders/OneSuite-API'
        type: string
      source_sha:
        description: 'Exact 40-character source commit SHA to build'
        required: true
        type: string
      source_ref:
        description: 'Optional source ref name for release notes'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: onesuite-release-${{ github.event.client_payload.source_sha || inputs.source_sha }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and publish EXE ZIPs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      EXPECTED_SOURCE_REPOSITORY: Sree-Cognicoders/OneSuite-API
      # Prisma generate only requires syntactically valid URLs during build.
      DATABASE_URL_MASTER: sqlserver://localhost:1433;database=Chronexa_Master;user=sa;password=Password123;encrypt=true;trustServerCertificate=true
      DATABASE_URL_TIMEPRO: sqlserver://localhost:1433;database=Chronexa_TimePro;user=sa;password=Password123;encrypt=true;trustServerCertificate=true
      DATABASE_URL_VISITPRO: sqlserver://localhost:1433;database=Chronexa_VisitPro;user=sa;password=Password123;encrypt=true;trustServerCertificate=true
      DATABASE_URL_MEALPRO: sqlserver://localhost:1433;database=Chronexa_MealPro;user=sa;password=Password123;encrypt=true;trustServerCertificate=true
      DATABASE_URL_PROJECTPRO: sqlserver://localhost:1433;database=Chronexa_ProjectPro;user=sa;password=Password123;encrypt=true;trustServerCertificate=true
      DATABASE_URL_AUDIT: sqlserver://localhost:1433;database=Chronexa_Audit;user=sa;password=Password123;encrypt=true;trustServerCertificate=true
      JWT_SECRET: release-build-secret
      NATS_URL: nats://localhost:4222
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Resolve and validate dispatch payload
        id: payload
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            SOURCE_REPOSITORY="${{ github.event.client_payload.source_repository }}"
            SOURCE_SHA="${{ github.event.client_payload.source_sha }}"
            SOURCE_REF="${{ github.event.client_payload.source_ref }}"
            SOURCE_RUN_ID="${{ github.event.client_payload.source_run_id }}"
          else
            SOURCE_REPOSITORY="${{ inputs.source_repository }}"
            SOURCE_SHA="${{ inputs.source_sha }}"
            SOURCE_REF="${{ inputs.source_ref }}"
            SOURCE_RUN_ID="manual"
          fi

          if [[ "$SOURCE_REPOSITORY" != "$EXPECTED_SOURCE_REPOSITORY" ]]; then
            echo "Unexpected source repository: $SOURCE_REPOSITORY" >&2
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid source SHA: $SOURCE_SHA" >&2
            exit 1
          fi

          SOURCE_SHA="${SOURCE_SHA,,}"
          SHORT_SHA="${SOURCE_SHA:0:12}"
          TAG="onesuite-${SHORT_SHA}"

          echo "source_repository=$SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stop if release already exists
        id: existing_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.payload.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists; skipping build and publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact source commit
        if: steps.existing_release.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.payload.outputs.source_repository }}
          ref: ${{ steps.payload.outputs.source_sha }}
          token: ${{ secrets.ORG_SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false

      - name: Verify checked-out commit
        if: steps.existing_release.outputs.exists != 'true'
        shell: bash
        working-directory: source
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "${{ steps.payload.outputs.source_sha }}" ]]; then
            echo "Checked out $actual_sha, expected ${{ steps.payload.outputs.source_sha }}" >&2
            exit 1
          fi

      - name: Setup Node.js
        if: steps.existing_release.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install dependencies
        if: steps.existing_release.outputs.exists != 'true'
        working-directory: source
        run: npm ci

      - name: Build Windows EXE ZIP packages
        if: steps.existing_release.outputs.exists != 'true'
        working-directory: source
        run: npm run build:exe

      - name: Verify build output
        if: steps.existing_release.outputs.exists != 'true'
        shell: bash
        working-directory: source
        run: |
          shopt -s nullglob
          files=(release-zip/*.zip)
          if (( ${#files[@]} == 0 )); then
            echo "No release ZIPs found in source/release-zip" >&2
            exit 1
          fi
          printf 'Generated %s release ZIP(s):\n' "${#files[@]}"
          ls -lh release-zip/*.zip

      - name: Create GitHub release and upload ZIP assets
        if: steps.existing_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.payload.outputs.tag }}
          name: OneSuite EXE build ${{ steps.payload.outputs.short_sha }}
          body: |
            ## OneSuite Windows EXE Release (${{ steps.payload.outputs.short_sha }})

            - **Source Repository**: `${{ steps.payload.outputs.source_repository }}`
            - **Commit SHA**: `${{ steps.payload.outputs.source_sha }}`
            - **Branch / Ref**: `${{ steps.payload.outputs.source_ref }}`
            - **Workflow Run**: `${{ steps.payload.outputs.source_run_id }}`

            ---

            ### 📦 Release Packages
            - **`onesuite-all-services-win-x64.zip`** — Complete bundle containing all microservices, configurations, and service management scripts in one unified package.
            - **Individual Service ZIPs** — Standalone packages for each microservice (`<service>-win-x64.zip`).
            - **Management Scripts** — `service.bat` and `manage-services.ps1` attached directly for easy automation.

            ---

            ### 🚀 Quick Start & Service Management
            1. Download and extract **`onesuite-all-services-win-x64.zip`** into your destination folder (e.g., `E:\App\OneSuite\`).
            2. Configure database, NATS, and Redis settings in the `.env` files.
            3. Open Command Prompt or PowerShell as Administrator and run:

            ```cmd
            :: Check service status
            service.bat status

            :: Start all microservices
            service.bat start

            :: Manage Product Groups
            service.bat start core        (Gateway, Auth, User, Master, Audit, Agent, Notify, Sync)
            service.bat start timepro     (Roster, Attendance, Leave, Policy, Approval, Report)
            service.bat start mealpro     (Meal Service)

            :: Manage Specific Microservice
            service.bat start api-gateway
            service.bat restart auth-service

            :: Windows Service Registration
            service.bat create            (Registers Windows Services for all apps)
            service.bat delete            (Unregisters Windows Services)
            ```
          generate_release_notes: true
          files: |
            source/release-zip/*.zip
            source/scripts/manage-services.ps1
            source/scripts/service.bat
            source/scripts/manage-services.bat
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
